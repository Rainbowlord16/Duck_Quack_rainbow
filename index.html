    <style>
        :root {
            --bg-dark: #070b14;
            --panel-bg: rgba(15, 23, 42, 0.78);
            --panel-border: rgba(255, 255, 255, 0.12);
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #172554 0%, #090d16 55%, #04060b 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'Fredoka', cursive, sans-serif;
            letter-spacing: 0.02em;
        }
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .arcade-btn {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
        }
        .arcade-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }
        .arcade-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
        }
        .arcade-btn:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }
        @keyframes duckSquash {
            0% { transform: scale(1, 1) rotate(0deg); }
            30% { transform: scale(1.16, 0.84) rotate(-3deg); }
            65% { transform: scale(0.94, 1.07) rotate(2deg); }
            100% { transform: scale(1, 1) rotate(0deg); }
        }
        .animate-squash {
            animation: duckSquash 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes floatUpFade {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            25% { opacity: 1; transform: translate(-50%, -26px) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -95px) scale(0.95); }
        }
        .floating-number {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            text-shadow: 0 3px 6px rgba(0,0,0,0.85), 0 0 12px rgba(250, 204, 21, 0.5);
            animation: floatUpFade 0.85s ease-out forwards;
        }
        @keyframes auraPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            50% { transform: scale(1.08) rotate(180deg); opacity: 1; }
        }
        .duck-aura-ring {
            animation: auraPulse 8s linear infinite;
        }
        @keyframes orbitFloat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -58%) scale(1.1); }
        }
        .orbit-pet-badge {
            animation: orbitFloat 2.4s ease-in-out infinite;
        }
        @keyframes skyFall {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(460px) rotate(360deg); opacity: 0.85; }
        }
        .falling-anomaly-orb {
            animation: skyFall 5.2s linear forwards;
        }
        .fever-glow {
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.55), inset 0 0 30px rgba(239, 68, 68, 0.35);
            border-color: rgba(251, 191, 36, 0.7) !important;
        }
        .rarity-common { border-color: #94a3b8; background: linear-gradient(145deg, rgba(51,65,85,0.6), rgba(15,23,42,0.8)); }
        .rarity-uncommon { border-color: #4ade80; background: linear-gradient(145deg, rgba(22,101,52,0.55), rgba(15,23,42,0.85)); }
        .rarity-rare { border-color: #38bdf8; background: linear-gradient(145deg, rgba(7,89,133,0.6), rgba(15,23,42,0.85)); }
        .rarity-epic { border-color: #c084fc; background: linear-gradient(145deg, rgba(107,33,168,0.6), rgba(15,23,42,0.85)); }
        .rarity-legendary { border-color: #facc15; background: linear-gradient(145deg, rgba(161,98,7,0.65), rgba(15,23,42,0.85)); }
        .rarity-mythical { border-color: #f43f5e; background: linear-gradient(145deg, rgba(159,18,57,0.65), rgba(15,23,42,0.85)); }
        .rarity-godly { border-color: #22d3ee; background: linear-gradient(145deg, rgba(21,94,117,0.75), rgba(88,28,135,0.85)); }
        @keyframes rainbowPrismCycle {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .rainbow-prism-anim {
            animation: rainbowPrismCycle 3s linear infinite;
        }
        @keyframes neonRainbowPulse {
            0% { filter: hue-rotate(0deg) brightness(1.35) saturate(2) drop-shadow(0 0 12px #ff0080); }
            50% { filter: hue-rotate(180deg) brightness(1.45) saturate(2.2) drop-shadow(0 0 18px #00ffff); }
            100% { filter: hue-rotate(360deg) brightness(1.35) saturate(2) drop-shadow(0 0 12px #ff0080); }
        }
        .neon-rainbow-admin {
            animation: neonRainbowPulse 1.8s linear infinite;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 999px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media (max-width: 640px) {
            .arcade-btn { min-height: 42px; }
            .modal-sheet { align-items: flex-end !important; padding: 0 !important; }
            .modal-sheet > div { border-bottom-left-radius: 0 !important; border-bottom-right-radius: 0 !important; max-height: 88vh !important; }
        }
    </style>
</head>
