name: Duck Quack audit
on:
  pull_request:
    branches: [main, "audit/**", "backend/**"]
  push:
    branches: [main, "audit/**"]
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run HTML, security, and JavaScript checks
        run: python tests/audit_html.py
      - name: Check backend JavaScript syntax
        run: node --check backend/worker.js && node --check backend/client.js
      - name: Run backend tests
        run: node --test backend/tests/*.test.mjs
